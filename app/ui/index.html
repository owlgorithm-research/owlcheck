<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Nothing loads from outside and no connections are allowed (connect-src 'none').
     'unsafe-eval' is only there because pywebview talks to Python through eval(); it opens no network access. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlCheck</title>
<style>
@font-face { font-family: "Pix"; font-weight: 400; src: url("{{FONT_SILK_400}}") format("woff2"); }
@font-face { font-family: "Pix"; font-weight: 700; src: url("{{FONT_SILK_700}}") format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 400; src: url("{{FONT_RUBIK_400}}") format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 500; src: url("{{FONT_RUBIK_500}}") format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 700; src: url("{{FONT_RUBIK_700}}") format("woff2"); }
@font-face { font-family: "Rubik"; font-weight: 900; src: url("{{FONT_RUBIK_900}}") format("woff2"); }

:root {
  --paper: #F2F1EC;
  --paper-2: #E8E7E1;
  --block: #D6D5CF;
  --mid: #8C8B86;
  --soft: #55544F;
  --ink: #111111;
  --dot: #b9b8b2;
  --text-2: #2b2a27;
  --line: 2px;
  --line-b: 2.5px;
  --dots: radial-gradient(circle, var(--dot) 1.1px, transparent 1.6px);
  --hatch: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 6px);
  --pix: "Pix", ui-monospace, monospace;
  --sans: "Rubik", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
/* Night mode: dark paper, light ink */
html[data-theme="dark"] {
  --paper: #16161A;
  --paper-2: #202026;
  --block: #2E2E36;
  --mid: #7D7C86;
  --soft: #AEADB6;
  --ink: #ECEAE3;
  --dot: #3A3A44;
  --text-2: #D3D1CA;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--sans);
  transition: background-color .24s steps(3), color .24s steps(3);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.app { min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.pix { font-family: var(--pix); letter-spacing: .02em; }
svg.px { shape-rendering: crispEdges; display: block; flex: none; }

/* Top bar */
.top { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: var(--line) solid var(--ink); }
.top img { width: 32px; height: 32px; }
.top .name { font: 700 16px/1 var(--pix); }
.top .ver { font: 400 12px var(--pix); color: var(--mid); }
.top .off { all: unset; cursor: pointer; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 12px;
  border: var(--line) solid var(--ink); border-radius: 99px; font: 400 12px var(--pix); }
.top .off:hover, .top .off[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.top .off:hover i, .top .off[aria-expanded="true"] i { background: var(--paper); }
.top .off:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.top .off .q { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: var(--line) solid currentColor; font: 700 10px/1 var(--pix); }
.offwrap { position: relative; }
.priv { position: absolute; right: 0; top: 42px; width: 390px; max-width: calc(100vw - 32px); z-index: 40; display: none;
  padding: 18px 18px 14px; background: var(--paper); color: var(--ink); border: var(--line-b) solid var(--ink); border-radius: 16px;
  box-shadow: 6px 6px 0 var(--ink); text-align: left; }
.priv.open { display: block; animation: popin .16s steps(3) both; transform-origin: top right; }
.priv::before { content: ""; position: absolute; top: -9px; right: 30px; width: 14px; height: 14px; background: var(--paper);
  border-left: var(--line-b) solid var(--ink); border-top: var(--line-b) solid var(--ink); transform: rotate(45deg); }
.priv h2 { margin: 0 0 12px; font: 900 19px/1.2 var(--sans); letter-spacing: -.01em; }
.priv ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.priv li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
.priv li .pi { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.priv li .pi svg { width: 16px; height: 16px; }
.priv li b { display: block; font: 700 11.5px var(--pix); margin: 1px 0 3px; }
.priv li p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--text-2); }
.priv code { display: block; margin-top: 5px; padding: 6px 8px; border-radius: 8px; background: var(--paper-2);
  font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--soft); word-break: break-all; }
.priv .pf { display: flex; justify-content: flex-end; margin-top: 12px; }
.priv .pf .btn { height: 34px; padding: 0 14px; font-size: 12px; }
.top .off i { width: 8px; height: 8px; background: var(--ink); border-radius: 50%; }

.view { display: none; flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 26px 28px 40px; }
.view.on { display: block; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 42px; padding: 0 18px;
  border: var(--line) solid var(--ink); border-radius: 99px; background: var(--paper); cursor: pointer;
  font: 700 13px var(--pix); white-space: nowrap; transition: transform .1s steps(2), box-shadow .1s steps(2); }
.btn.big:hover .spark { animation: spin .6s steps(4) infinite; }
.btn:hover { box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
.btn:active { box-shadow: none; transform: none; }
.btn.black { background: var(--ink); color: var(--paper); }
.btn.big { height: 56px; padding: 0 26px; font-size: 15px; }
.btn.ghost { border-color: transparent; padding: 0 10px; }
.btn.ghost:hover { box-shadow: none; transform: none; text-decoration: underline; text-underline-offset: 4px; }
.btn svg { width: 14px; height: 14px; }
.spark { width: 14px; height: 14px; }
kbd { font: 400 11px var(--pix); border: var(--line) solid var(--ink); border-bottom-width: 4px; border-radius: 6px; padding: 1px 6px; background: var(--paper); }

/* Home: the "insert coin" screen */
.screen { position: relative; padding: 44px 32px 38px; text-align: center; background-color: var(--paper);
  background-image: var(--dots); background-size: 22px 22px; background-position: 11px 11px;
  border: var(--line) solid var(--ink); border-radius: 18px; transition: background-color .15s; }
.screen.hot { background-color: var(--block); }
.screen .c { position: absolute; width: 34px; height: 34px; border: 5px solid var(--ink); }
.screen .c.tl { top: -9px; left: -9px; border-right: 0; border-bottom: 0; }
.screen .c.tr { top: -9px; right: -9px; border-left: 0; border-bottom: 0; }
.screen .c.bl { bottom: -9px; left: -9px; border-right: 0; border-top: 0; }
.screen .c.br { bottom: -9px; right: -9px; border-left: 0; border-top: 0; }
.coin { display: inline-flex; align-items: center; height: 30px; padding: 0 16px; border: var(--line) solid var(--ink);
  border-radius: 99px; background: var(--paper); font: 400 12px var(--pix); }
.headline { position: relative; display: block; width: fit-content; max-width: min(88%, 660px); margin: 34px auto 4px; }
.screen h1 { margin: 0; font: 900 clamp(32px, 4.8vw, 50px)/1.05 var(--sans); letter-spacing: -.03em; text-wrap: balance; }
.screen p { margin: 10px auto 26px; max-width: 46ch; color: var(--soft); }
.engines { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin: -8px auto 26px; }
.engines .el { font: 500 13px var(--sans); color: var(--soft); margin-right: 2px; }
.engines .eng { font: 400 11px var(--pix); letter-spacing: .04em; padding: 5px 10px 4px; background: var(--paper);
  border: var(--line) solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink); }
.facts span.e { background: var(--ink); color: var(--paper); }
.screen .act { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.screen .keys { display: inline-flex; gap: 4px; align-items: center; }
.err { display: none; margin: 20px auto 0; max-width: 56ch; padding: 12px 14px; text-align: left; align-items: flex-start; gap: 10px;
  background: var(--paper); border: var(--line-b) solid var(--ink); border-radius: 12px; font-weight: 500; }
.err.on { display: flex; }

/* Recent projects */
.slots { margin-top: 34px; }
.sect { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font: 700 13px var(--pix); }
.sect::after { content: ""; flex: 1; height: var(--line); background: var(--ink); }
.sect .n { color: var(--mid); font-weight: 400; }
.slot-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.slot { display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 10px 10px 10px 12px;
  border: var(--line) solid var(--ink); border-radius: 12px; background: var(--paper); transition: transform .1s steps(2), box-shadow .1s steps(2); }
.slot:hover { background: var(--paper-2); transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
.slot .num { font: 400 11px var(--pix); background: var(--ink); color: var(--paper); padding: 4px 7px; border-radius: 6px; }
.slot .open { all: unset; cursor: pointer; min-width: 0; display: block; }
.slot .open:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.slot .sn { font-weight: 700; }
.slot .sp { color: var(--mid); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.slot .sw { font: 400 11px var(--pix); color: var(--mid); }
.slot .rm { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; font: 700 14px var(--pix); }
.slot .rm:hover { background: var(--ink); color: var(--paper); }
.slot .rm:focus-visible { outline: 3px solid var(--ink); }
.empty { padding: 18px; border: var(--line) dashed var(--mid); border-radius: 12px; color: var(--soft); text-align: center; }

/* Loading */
.loading { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 110px 0; }
.loading.on { display: flex; }
.loading img { width: 96px; height: 96px; animation: bob 1s steps(2) infinite; }
.loading .lt { font: 700 14px var(--pix); }
.segs { display: flex; gap: 5px; padding: 5px; border: var(--line-b) solid var(--ink); border-radius: 10px; }
.segs i { width: 16px; height: 14px; border-radius: 3px; background: var(--ink); opacity: .15; animation: seg 1.2s steps(1) infinite; }
.segs i:nth-child(2) { animation-delay: .15s } .segs i:nth-child(3) { animation-delay: .3s } .segs i:nth-child(4) { animation-delay: .45s }
.segs i:nth-child(5) { animation-delay: .6s } .segs i:nth-child(6) { animation-delay: .75s } .segs i:nth-child(7) { animation-delay: .9s }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes seg { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .15; } }

/* Results */
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.head .grow { flex: 1; }
.proj { margin-top: 22px; display: flex; gap: 14px; align-items: flex-start; }
.proj .pn { font: 700 18px/1.25 var(--sans); }
.proj .pp { color: var(--mid); font-size: 12.5px; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.facts span { font: 400 11px var(--pix); border: var(--line) solid var(--ink); border-radius: 99px; padding: 3px 9px; }

.verdict { margin: 30px 0 0; display: flex; align-items: center; gap: 22px; }
.verdict .vi { flex: none; width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center; border: var(--line-b) solid var(--ink); }
.verdict .vi svg { width: 40px; height: 40px; }
.verdict.crit .vi { background: var(--ink); color: var(--paper); }
.verdict.warn .vi { background-color: var(--paper); background-image: var(--hatch); }
.verdict.warn .vi svg { background: var(--paper); padding: 4px; width: 48px; height: 48px; border-radius: 8px; }
.verdict.ok .vi { background: var(--paper); }
.verdict h1 { margin: 0; font: 900 clamp(34px, 5.4vw, 58px)/1 var(--sans); letter-spacing: -.035em; }
.verdict p { margin: 10px 0 0; color: var(--soft); font-size: 16px; max-width: 58ch; }

/* Scoreboard and filters */
.board { margin-top: 28px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.tab { all: unset; cursor: pointer; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 12px;
  border: var(--line) solid var(--ink); border-radius: 14px; background: var(--paper); min-width: 0; }
.tab { transition: transform .1s steps(2), box-shadow .1s steps(2); }
.tab:hover { background: var(--paper-2); transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
.tab.on:hover { background: var(--ink); }
.tab:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.tab .tl { display: flex; align-items: center; gap: 8px; font: 400 11.5px var(--pix); white-space: nowrap; }
.tab .tl svg { width: 16px; height: 16px; }
.tab .tn { font: 700 28px/1 var(--pix); }
.tab.on { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--block); }
.tab.zero { color: var(--mid); }

/* XP bar */
.exp { margin-top: 22px; }
.exp .eb { height: 22px; border: var(--line-b) solid var(--ink); border-radius: 99px; padding: 3px; background: var(--paper); }
.exp .eb i { display: block; height: 100%; width: 0; min-width: 0; border-radius: 99px; background: var(--ink); transition: width .35s steps(12); }
.exp .el { display: flex; justify-content: space-between; margin-top: 8px; font: 400 12px var(--pix); }

/* Findings */
.list { margin-top: 8px; }
.group { margin-top: 30px; }
.sect svg { width: 16px; height: 16px; }
.sect svg.chev { width: 10px; height: 14px; }
.items { display: grid; gap: 12px; }
.item { position: relative; display: grid; grid-template-columns: 26px 1fr; gap: 14px; padding: 16px 18px;
  border: var(--line) solid var(--ink); border-radius: 14px; background: var(--paper); }
.item.CRITICAL { border-width: var(--line-b); box-shadow: 5px 5px 0 var(--ink); padding: 18px 20px; }
.item.WARNING { padding-left: 34px; }
.item.WARNING::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 18px; background-image: var(--hatch);
  border-right: var(--line) solid var(--ink); border-radius: 12px 0 0 12px; }
.item.RECOMMENDED { background: var(--paper-2); border-style: solid; border-color: var(--soft); }
.item.OK { border-style: dashed; border-color: var(--mid); padding: 12px 16px; }
.item .check { all: unset; cursor: pointer; box-sizing: border-box; width: 24px; height: 24px; border: var(--line-b) solid var(--ink);
  border-radius: 6px; display: grid; place-items: center; background: var(--paper); margin-top: 1px; }
.item .check svg { width: 14px; height: 14px; opacity: 0; }
.item .check:hover { background: var(--block); }
.item .check:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.item.done .check { background: var(--ink); color: var(--paper); }
.item.done .check svg { opacity: 1; }
.item.done .it { text-decoration: line-through; text-decoration-thickness: 2px; }
.item.done .it, .item.done .id, .item.done .fx, .item.done .files { opacity: .45; }
.item.done.CRITICAL { box-shadow: 2px 2px 0 var(--ink); }
.item .row { display: flex; gap: 12px; align-items: flex-start; }
.item .it { font: 700 16px/1.35 var(--sans); }
.item.CRITICAL .it { font-size: 18px; }
.item .cat { margin-left: auto; flex: none; font: 400 11px var(--pix); border: var(--line) solid var(--ink); border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
.item .id { margin: 6px 0 0; color: var(--text-2); max-width: 74ch; }
.item .fx { margin: 12px 0 0; max-width: 74ch; padding: 10px 12px; border-radius: 10px; background: var(--paper-2); }
.item.RECOMMENDED .fx { background: var(--paper); }
.item .fx b { font: 700 11px var(--pix); display: block; margin-bottom: 2px; }
.item .files { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.item .files li { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--soft); word-break: break-all;
  padding-left: 16px; position: relative; }
.item .files li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; background: var(--ink); }
.item .more { all: unset; cursor: pointer; margin-top: 8px; font: 700 11px var(--pix); border-bottom: var(--line) solid var(--ink); }
.item .more:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.okfold { margin-top: 30px; }
.okfold summary { cursor: pointer; list-style: none; display: block; }
.okfold summary .sect { width: 100%; }
.okfold summary::-webkit-details-marker { display: none; }
.okfold summary .sect { margin-bottom: 0; }
.okfold[open] summary .sect { margin-bottom: 12px; }
.okfold summary .chev { transition: transform .15s; }
.okfold[open] summary .chev { transform: rotate(90deg); }
.nothing { margin-top: 24px; padding: 20px; border: var(--line) dashed var(--mid); border-radius: 12px; color: var(--soft); text-align: center; }

/* Export menu */
.menu { position: relative; }
.menu .pop { display: none; position: absolute; right: 0; top: 50px; width: 320px; z-index: 20; padding: 6px;
  background: var(--paper); border: var(--line-b) solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink); }
.menu.open .pop { display: block; }
.menu .pop button { all: unset; cursor: pointer; box-sizing: border-box; display: block; width: 100%; padding: 10px 12px; border-radius: 9px; }
.menu .pop button:hover, .menu .pop button:focus-visible { background: var(--ink); color: var(--paper); }
.menu .pop button:hover small, .menu .pop button:focus-visible small { color: var(--block); }
.menu .pop b { font: 700 12px var(--pix); display: block; margin-bottom: 2px; }
.menu .pop small { display: block; color: var(--soft); font-size: 13px; line-height: 1.4; }

.foot { margin-top: 44px; padding-top: 14px; border-top: var(--line) solid var(--ink); color: var(--soft); font-size: 13px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 50;
  max-width: min(580px, calc(100% - 32px)); padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--paper);
  border: var(--line-b) solid var(--ink); box-shadow: 5px 5px 0 var(--block); font-weight: 500; transition: opacity .15s, transform .15s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast.bad { background: var(--paper); color: var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.toast code { display: block; margin-top: 6px; font: 12px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }

/* Header toggles. Every animation uses steps() so it moves like a sprite. */
.mtog { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; height: 30px; padding: 0 10px 0 12px;
  border: var(--line) solid var(--ink); border-radius: 99px; font: 400 12px var(--pix); }
.mtog:hover { background: var(--paper-2); }
.mtog:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.mtog .tr { position: relative; width: 30px; height: 16px; border: var(--line) solid var(--ink); border-radius: 99px; }
.mtog .tr i { position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; border-radius: 2px; background: var(--ink); transition: left .12s steps(3); }
.mtog[aria-pressed="true"] .tr { background: var(--ink); }
.mtog[aria-pressed="true"] .tr i { left: 16px; background: var(--paper); }

.ntog { all: unset; cursor: pointer; box-sizing: border-box; width: 30px; height: 30px; display: grid; place-items: center;
  border: var(--line) solid var(--ink); border-radius: 50%; }
.ntog:hover { background: var(--paper-2); }
.ntog:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.ntog svg { width: 16px; height: 16px; }
.ntog.flip svg { animation: pop .3s steps(4); }
.langs { margin-left: auto; display: inline-flex; height: 30px; border: var(--line) solid var(--ink); border-radius: 99px; padding: 2px; gap: 2px; }
.langs button { all: unset; cursor: pointer; padding: 0 9px; border-radius: 99px; font: 400 12px/24px var(--pix); }
.langs button:hover { background: var(--paper-2); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.langs button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Scan log */
.scan { display: none; flex: 1; align-items: center; justify-content: center; padding: 60px 28px; cursor: pointer; }
.scan.on { display: flex; }
.scan-box { width: min(620px, 100%); border: var(--line-b) solid var(--ink); border-radius: 18px; padding: 22px 24px 18px;
  background-color: var(--paper); background-image: var(--dots); background-size: 22px 22px; box-shadow: 6px 6px 0 var(--ink); }
.scan-head { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: var(--line) solid var(--ink); }
.scan-head img { width: 48px; height: 48px; animation: bob 1s steps(2) infinite; }
.scan-head b { display: block; font: 700 14px var(--pix); }
.scan-head span { display: block; color: var(--soft); font-size: 14px; overflow-wrap: anywhere; }
.scan-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; min-height: 9em; }
.scan-log li { display: flex; gap: 10px; align-items: baseline; font: 400 12.5px/1.5 var(--pix); animation: type .32s steps(14) both; }
.scan-log li::before { content: ""; flex: none; width: 7px; height: 7px; background: var(--ink); transform: translateY(-1px); }
.scan-log li.done { margin-top: 6px; padding: 9px 12px; border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 700; }
.scan-log li.done::before { background: var(--paper); }
.scan-log li.cursor::after { content: ""; width: 8px; height: 13px; background: currentColor; animation: blink .5s steps(1) infinite; }
.scan-skip { margin: 14px 0 0; color: var(--mid); font: 400 11px var(--pix); text-align: right; }

/* Theme switch: night (or day) spreads out from the button */
.ntog { position: relative; overflow: hidden; }
.ntog .ic { position: absolute; inset: 0; display: grid; place-items: center; }
.ntog .ic.old { animation: sink .42s steps(5) forwards; }
.ntog .ic.new { animation: riseup .42s steps(5) .16s both; }
html.vt-theme body { transition: none; }
html.vt-theme::view-transition-old(root), html.vt-theme::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html.vt-theme::view-transition-new(root) { animation: wipe .72s steps(9) both; }
.star-once { position: absolute; color: var(--ink); width: 14px; height: 14px; opacity: 0; animation: starOnce 1.1s steps(5) both; }
.star-once svg { width: 100%; height: 100%; }
@keyframes sink { to { transform: translateY(20px); opacity: 0; } }
@keyframes riseup { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wipe { from { clip-path: circle(0 at var(--vt-x) var(--vt-y)); } to { clip-path: circle(var(--vt-r) at var(--vt-x) var(--vt-y)); } }
@keyframes starOnce { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.1); }
  60% { opacity: .8; transform: scale(.7) rotate(45deg); } 100% { opacity: 0; transform: scale(.3); } }

/* Idle */
.coin .blink { animation: blink 1.1s steps(1) infinite; }
.headline { transition: transform .15s steps(3); }
.twk { position: absolute; width: 18px; height: 18px; color: var(--ink); opacity: .2; animation: twinkle 2.4s steps(4) infinite; }
.twk.s1 { top: -6px; right: 6%; }
.twk.s2 { bottom: 4px; left: 4%; width: 14px; height: 14px; animation-delay: .8s; }
.twk.s3 { top: 52%; right: 1%; width: 12px; height: 12px; animation-delay: 1.6s; }

/* Folder dragged over the window */
.screen .c { transition: transform .18s steps(3); }
.screen.hot .c.tl { transform: translate(14px, 14px); }
.screen.hot .c.tr { transform: translate(-14px, 14px); }
.screen.hot .c.bl { transform: translate(14px, -14px); }
.screen.hot .c.br { transform: translate(-14px, -14px); }
.screen.hot { animation: march .5s steps(2) infinite; }
.screen.hot .headline { transform: translateY(-6px); }
.screen.hot .coin { background: var(--ink); color: var(--paper); }
.screen.hot .coin .blink { animation: none; }

/* Results coming in */
.reveal .verdict .vi { animation: pop .42s steps(5) both; }
.reveal .verdict h1 { animation: type .55s steps(18) .12s both; }
.reveal .verdict p { animation: appear .2s steps(2) .6s both; }

/* Reactions */
.items.swap > .item { animation: flick .2s steps(2) both; animation-delay: calc(var(--i, 0) * 30ms); }
.item .check.pop { animation: pop .3s steps(4); }
.item.stamp { animation: stamp .22s steps(2); }
.plus { position: absolute; left: 14px; top: 2px; font: 700 13px var(--pix); pointer-events: none; animation: floatup .7s steps(6) forwards; }
.menu.open .pop { animation: popin .16s steps(3) both; transform-origin: top right; }
.err.shake { animation: shake .36s steps(6); }
.toast { transition: opacity .15s steps(3), transform .15s steps(3); }
.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.bit { position: absolute; width: 8px; height: 8px; background: var(--ink); animation: burst .9s steps(8) forwards; }
.bit.hollow { background: transparent; border: 2px solid var(--ink); }
.bit svg { width: 100%; height: 100%; }
.bit.star { background: transparent; width: 16px; height: 16px; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes spin { to { transform: rotate(90deg); } }
@keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .2; } 25% { transform: scale(1); opacity: 1; }
  50% { transform: scale(.7) rotate(45deg); opacity: .8; } 75% { transform: scale(.4); opacity: .3; } }
@keyframes march { from { background-position: 11px 11px; } to { background-position: 33px 11px; } }
@keyframes pop { 0% { transform: scale(.2); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes flick { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
@keyframes stamp { 50% { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); } }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
@keyframes popin { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes burst { from { transform: translate(0, 0) rotate(0); opacity: 1; }
  to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

@media (max-width: 820px) {
  .board { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .top { padding: 12px 16px; } .top .off span, .mtog .ml { display: none; }
  .twk { display: none; }
  .view { padding: 18px 16px 32px; }
  .screen { padding: 34px 16px 30px; }
  .headline { margin-top: 24px; }
  .board { grid-template-columns: repeat(2, 1fr); }
  .verdict { gap: 14px; } .verdict .vi { width: 56px; height: 56px; } .verdict .vi svg { width: 30px; height: 30px; }
  .slot { grid-template-columns: auto 1fr auto; } .slot .sw { display: none; }
  .item .row { flex-direction: column; gap: 6px; } .item .cat { margin-left: 0; }
}
/* The owl is pixel art, so no smoothing when scaled */
img.owl { image-rendering: pixelated; image-rendering: crisp-edges; }
html[data-theme="dark"] img.owl { filter: invert(1); }
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }
</style>
</head>

    replay(e, "shake");
  }

  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 90) return t("agoNow");
    if (s < 3600) return t("agoMin", { n: Math.round(s / 60) });
    if (s < 86400) return t("agoH", { n: Math.round(s / 3600) });
    const d = Math.round(s / 86400);
    return d === 1 ? t("agoYesterday") : t("agoDays", { n: d });
  }

  // Home
  function renderRecent(recent) {
    const box = $("recent");
    box.replaceChildren();
    const h = el("h2", "sect");
    h.append(document.createTextNode(t("recent")));
    box.appendChild(h);
    if (!recent || !recent.length) {
      box.appendChild(el("div", "empty", t("recentEmpty")));
      return;
    }
    const ul = el("ul", "slot-list");
    recent.forEach((r, i) => {
      const li = el("li", "slot");
      const open = el("button", "open");
      open.title = r.path;
      open.appendChild(el("div", "sn", r.name));
      const p = el("div", "sp"); p.textContent = "‎" + r.path; open.appendChild(p);
      open.addEventListener("click", () => analyze(r.path));
      const rm = el("button", "rm", "x");
      rm.title = t("remove"); rm.setAttribute("aria-label", t("removeAria", { name: r.name }));
      rm.addEventListener("click", async () => renderRecent((await api.remove_recent(r.path)).recent));
      li.append(el("span", "num", t("slot") + " " + two(i + 1)), open, el("span", "sw", ago(r.when)), rm);
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  async function goHome() {
    show("home");
    setErr("");
    if (apiOk) renderRecent((await api.get_state()).recent);
  }

  // Scan log. It shows only real numbers from the analysis.
  function secs(x) {
    return x < 0.01 ? "< " + num(0.01) : Number(x).toLocaleString(STR[lang].locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function engineLabel(r) {
    if (!r.engine || r.engine === "generic") return t("engineUnknown");
    return r.engine_name + (r.engine_version ? " " + r.engine_version : "");
  }
  function scanLines(res) {
    const s = res.scan;
    const u = s.units || { kind: "", names: [] };
    const lines = [res.engine === "generic" ? t("scanGeneric") : t("scanEngine", { engine: engineLabel(res) }),
      t("scanFiles", { n: s.files }) + (s.gdignored ? " " + t("scanIgnored", { n: s.gdignored }) : "")];
    if (u.kind === "presets") lines.push(s.presets ? t("scanPresets", { n: s.presets }) : t("scanNoPresets"));
    if (u.kind === "build_scenes") lines.push(t("scanBuildScenes", { n: u.names.length }));
    if (u.kind === "rooms") lines.push(t("scanRooms", { n: u.names.length }));
    lines.push(t("scanSecrets", { n: s.secret_files }));
    if (res.engine !== "generic") lines.push(t("scanScripts", { n: s.scripts }));
    (s.demos || []).forEach((d) => lines.push(t("scanDemo", { name: d.name, n: d.scenes })));
    lines.push(t("scanMeta"));
    lines.push(t("scanDone", { checks: s.checks, findings: t("findingsN", { n: s.findings }), s: secs(res.elapsed) }));
    return lines;
  }
  function runScan(res) {
    return new Promise((resolve) => {
      const log = $("scanLog");
      log.replaceChildren();
      $("scanName").textContent = res.name;
      show("scan");
      const lines = scanLines(res);
      let i = 0, timer = null, done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        $("scan").removeEventListener("click", finish);
        document.removeEventListener("keydown", onKey, true);
        resolve();
      };
      const onKey = (e) => { if (["Enter", " ", "Escape"].includes(e.key)) { e.preventDefault(); finish(); } };
      $("scan").addEventListener("click", finish);
      document.addEventListener("keydown", onKey, true);
      const next = () => {
        if (done) return;
        log.querySelectorAll(".cursor").forEach((n) => n.classList.remove("cursor"));
        if (i >= lines.length) { timer = setTimeout(finish, 700); return; }
        const li = el("li", (i === lines.length - 1 ? "done " : "") + "cursor", lines[i]);
        log.appendChild(li);
        i++;
        timer = setTimeout(next, i === lines.length ? 420 : 210);
      };
      next();
    });
  }

  // Analysis
  async function analyze(path, opts = {}) {
    if (!apiOk || state.busy) return;
    state.busy = true;
    const slow = setTimeout(() => show("loading"), 150);
    try {
      const res = await api.analyze(path);
      clearTimeout(slow);
      await handleResult(res, opts.scan !== false);
    } catch (e) {
      clearTimeout(slow);
      show("home");
      setErr(t("errUnexpected") + (e && e.message ? e.message : e));
    } finally { state.busy = false; }
  }

  async function choose() {
    if (!apiOk || state.busy) return;
    state.busy = true;
    try {
      const res = await api.choose_folder();
      if (res) await handleResult(res, true);
    } catch (e) {
      show("home");
      setErr(t("errUnexpected") + (e && e.message ? e.message : e));
    } finally { state.busy = false; }
  }

  async function handleResult(res, scan = false) {
    if (!res) { show("home"); return; }
    if (res.error) { goHome().then(() => setErr(res.error)); return; }
    state.result = res;
    state.filter = "all";
    if (scan && motion && res.scan) await runScan(res);
    renderResults(true);
    show("results");
    replay($("results"), "reveal");
  }

  // Results
  function verdictFor(c) {
    if (c.CRITICAL) return ["crit", "CRITICAL", t("vCrit"), t("vCritText", { n: c.CRITICAL })];
    if (c.WARNING) return ["warn", "WARNING", t("vWarn"), t("vWarnText", { n: c.WARNING })];
    return ["ok", "OK", t("vOk"), t("vOkText")];
  }

  function renderResults(animate = false) {
    const r = state.result;
    $("pName").textContent = r.name;
    $("pPath").textContent = r.path;
    const facts = $("pFacts"); facts.replaceChildren();
    const st = r.stats, u = st.units || { kind: "", names: [] };
    facts.appendChild(el("span", "e", engineLabel(r)));
    const list = [t("files", { n: st.files })];
    if (r.engine !== "generic") {
      list.push(r.engine === "gamemaker" ? t("rooms", { n: st.scenes }) : t("scenes", { n: st.scenes }));
      list.push(t("scripts", { n: st.scripts }));
    }
    list.push(st.size_mb < 0.1 ? t("sizeSmall") : t("size", { n: num(st.size_mb) }));
    let unitChip = null;
    if (u.kind === "presets") unitChip = u.names.length ? t("presets", { n: u.names.length }) : t("noPresets");
    if (u.kind === "build_scenes") unitChip = t("buildScenes", { n: u.names.length });
    if (unitChip) list.push(unitChip);
    list.push(r.elapsed < 0.1 ? t("readFast") : t("read", { n: num(r.elapsed) }));
    list.forEach((x) => {
      const s = el("span", null, x);
      if (x === unitChip && u.names.length) s.title = u.names.join(", ");
      facts.appendChild(s);
    });

    const [tone, icon, title, text] = verdictFor(r.counts);
    const v = $("verdict"); v.className = "verdict " + tone;
    v.querySelector(".vi").innerHTML = pix(icon);
    v.querySelector("h1").textContent = title;
    v.querySelector("p").textContent = text;
    renderTabs(animate); renderList(false); renderProgress(animate);
  }

  function renderProgress(fromZero = false) {
    const todo = state.result.findings.filter((f) => f.severity !== "OK");
    const done = todo.filter((f) => f.checked).length;
    const width = todo.length ? `${(done / todo.length) * 100}%` : "100%";
    const bar = $("barFill");
    if (fromZero && motion) {
      bar.style.transition = "none"; bar.style.width = "0"; void bar.offsetWidth; bar.style.transition = "";
      setTimeout(() => (bar.style.width = width), 350);
    } else bar.style.width = width;
    $("progressText").textContent = todo.length ? t("progress", { d: done, n: todo.length }) : t("progressNone");
    $("progressTotal").textContent = todo.length ? `${Math.round((done / todo.length) * 100)}%` : "100%";
  }

  function renderTabs(animate = false) {
    const c = state.result.counts;
    const nav = $("tabs"); nav.replaceChildren();
    const make = (key, label, n, icon) => {
      const b = el("button", "tab" + (state.filter === key ? " on" : "") + (n === 0 ? " zero" : ""));
      b.setAttribute("aria-pressed", String(state.filter === key));
      const tl = el("span", "tl");
      tl.innerHTML = pix(icon);
      tl.appendChild(document.createTextNode(label));
      const tn = el("span", "tn", two(n));
      b.append(tl, tn);
      if (animate) countUp(tn, n);
      b.addEventListener("click", () => { state.filter = key; renderTabs(); renderList(true); });
      nav.appendChild(b);
    };
    make("all", t("all"), state.result.findings.length, "ALL");
    ORDER.forEach((s) => make(s, t(s), c[s] || 0, s));
  }

  function itemNode(f) {
    const it = el("article", `item ${f.severity}` + (f.checked ? " done" : ""));
    const chk = el("button", "check");
    chk.innerHTML = CHECK;
    const sync = () => {
      chk.setAttribute("aria-pressed", String(f.checked));
      chk.setAttribute("aria-label", (f.checked ? t("unmark") : t("mark")) + f.title);
      it.classList.toggle("done", f.checked);
    };
    sync();
    chk.addEventListener("click", async () => {
      f.checked = !f.checked; sync(); renderProgress();
      if (f.checked && motion) {
        replay(chk, "pop"); replay(it, "stamp");
        const plus = el("span", "plus", "+1");
        it.appendChild(plus); setTimeout(() => plus.remove(), 750);
        const todo = state.result.findings.filter((x) => x.severity !== "OK");
        if (todo.length && todo.every((x) => x.checked)) {
          const r = chk.getBoundingClientRect();
          setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2, 28), 120);
        }
      }
      const todoAll = state.result.findings.filter((x) => x.severity !== "OK");
      if (f.checked && todoAll.length && todoAll.every((x) => x.checked)) toast(t("complete"));
      try { await api.set_checked(state.result.path, f.key, f.checked); } catch (e) {}
    });
    if (f.severity === "OK") { chk.disabled = true; chk.style.visibility = "hidden"; }
    const body = el("div");
    const row = el("div", "row");
    row.append(el("div", "it", f.title), el("span", "cat", f.category));
    body.append(row, el("p", "id", f.detail));
    if (f.fix) {
      const fx = el("div", "fx");
      fx.append(el("b", null, t("howFix")), document.createTextNode(f.fix));
      body.appendChild(fx);
    }
    if (f.items && f.items.length) {
      const ul = el("ul", "files");
      f.items.forEach((x, i) => { const li = el("li", null, x); if (i >= FILES_SHOWN) li.hidden = true; ul.appendChild(li); });
      body.appendChild(ul);
      if (f.items.length > FILES_SHOWN) {
        const more = el("button", "more", t("more", { n: f.items.length - FILES_SHOWN }));
        more.addEventListener("click", () => {
          const hidden = [...ul.children].some((li) => li.hidden);
          [...ul.children].forEach((li, i) => (li.hidden = !hidden && i >= FILES_SHOWN));
          more.textContent = hidden ? t("less") : t("more", { n: f.items.length - FILES_SHOWN });
        });
        body.appendChild(more);
      }
    }
    it.append(chk, body);
    return it;
  }

  function sectionTitle(s, n, prefix = "") {
    const h = el("h2", "sect");
    h.innerHTML = prefix + pix(s);
    h.append(document.createTextNode(t(s)), el("span", "n", two(n)));
    return h;
  }

  function renderList(animate = false) {
    const list = $("list"); list.replaceChildren();
    const fs = state.result.findings;
    const sevs = state.filter === "all" ? ORDER : [state.filter];
    let any = false;
    sevs.forEach((s) => {
      const group = fs.filter((f) => f.severity === s);
      if (!group.length) return;
      any = true;
      const items = el("div", "items" + (animate && motion ? " swap" : ""));
      group.forEach((f, i) => { const n = itemNode(f); n.style.setProperty("--i", Math.min(i, 10)); items.appendChild(n); });
      if (s === "OK" && state.filter === "all") {
        const d = el("details", "okfold");
        const sum = el("summary");
        sum.appendChild(sectionTitle(s, group.length, CHEV));
        d.append(sum, items);
        list.appendChild(d);
        return;
      }
      const g = el("section", "group");
      g.append(sectionTitle(s, group.length), items);
      list.appendChild(g);
    });
    if (!any) list.appendChild(el("p", "nothing", t("nothing")));
  }

  // Export
  const menu = $("exportMenu");
  function closeMenu() { menu.classList.remove("open"); $("exportBtn").setAttribute("aria-expanded", "false"); }
  $("exportBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    const open = !menu.classList.contains("open");
    menu.classList.toggle("open", open);
    $("exportBtn").setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", closeMenu);
  menu.querySelectorAll("[data-export]").forEach((b) => b.addEventListener("click", async (e) => {
    e.stopPropagation(); closeMenu();
    const kind = b.dataset.export;
    const path = state.result.path;
    const res = kind === "manifest" ? await api.make_manifest(path) : await api.export_report(path, kind);
    if (!res || res.cancelled) return;
    if (res.error) { toast(res.error, true); return; }
    if (kind === "manifest") {
      toast(t("toastManifest", { files: t("files", { n: res.files }) }), false, el("code", null, res.hash));
    } else {
      toast(t("toastReport"), false, el("code", null, res.saved));
    }
  }));

  // Drag and drop
  const drop = $("drop");
  let dropTimer;
  const coin = $("coinText");
  function setHot(on) {
    drop.classList.toggle("hot", on);
    coin.textContent = on ? t("coinHot") : t("coin");
  }
  ["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => {
    e.preventDefault();
    if ($("home").classList.contains("on")) setHot(true);
  }));
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) setHot(false); });
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    setHot(false);
    if (!$("home").classList.contains("on")) return;
    clearTimeout(dropTimer);
    dropTimer = setTimeout(() => setErr(t("noPath")), 2500);
  });
  // Python calls this with the dropped folder's path; the page itself can't see it
  window.owlDropped = (path) => {
    clearTimeout(dropTimer);
    if (path) analyze(path); else setErr(t("noPath"));
  };

  // Keyboard shortcuts
  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "o") { e.preventDefault(); choose(); }
    if (mod && e.key.toLowerCase() === "r" && state.result && $("results").classList.contains("on")) { e.preventDefault(); analyze(state.result.path, { scan: false }); }
    if (e.key === "Escape") closeMenu();
  });

  $("choose").addEventListener("click", choose);
  $("back").addEventListener("click", goHome);
  $("rerun").addEventListener("click", () => analyze(state.result.path, { scan: false }));

  let booted = false;
  async function boot() {
    if (booted || !bridgeReady()) return;
    booted = true;
    apiOk = true;
    const st = await api.get_state();
    if (st.platform === "darwin") $("kbmod").textContent = "⌘";
    if (st.config_path) $("privPath").textContent = st.config_path;
    if (st.prefs && typeof st.prefs.motion === "boolean") applyMotion(st.prefs.motion, false);
    if (st.prefs && st.prefs.lang) setLang(st.prefs.lang, false);
    if (st.prefs && (st.prefs.theme === "dark" || st.prefs.theme === "light")) { themeSaved = true; applyTheme(st.prefs.theme === "dark", false); }
    renderRecent(st.recent);
  }
  // pywebviewready can fire before this script runs, so also poll every 50 ms
  window.addEventListener("pywebviewready", boot);
  const waitBridge = setInterval(() => { if (booted) clearInterval(waitBridge); else boot(); }, 50);
  boot();
})();
</script>
</body>
</html>
