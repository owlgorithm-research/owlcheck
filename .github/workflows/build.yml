name: Build

# Tests and builds the app on Windows, macOS and Linux. Pushes to main keep the
# builds as run artifacts. A v* tag also publishes a release with SHA256SUMS.txt,
# so anyone can check that a download was built from this source.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OwlCheck-Windows.zip
          - os: macos-latest
            artifact: OwlCheck-macOS.zip
          - os: ubuntu-22.04
            artifact: OwlCheck-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build the app
        run: python packaging/build_exe.py --force

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OwlCheck -DestinationPath ${{ matrix.artifact }}

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          python packaging/build_exe.py --installer
          Copy-Item dist/OwlCheck-Setup-*.exe OwlCheck-Setup.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: OwlCheck-Setup.exe
          path: OwlCheck-Setup.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/OwlCheck.app ${{ matrix.artifact }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }} -C dist OwlCheck

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
